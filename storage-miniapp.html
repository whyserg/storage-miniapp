<!DOCTYPE html>
<html lang="ru" data-theme="light" data-theme-pref="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>Хранилище</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* ============================================================
     Токены
     ============================================================ */
  :root {
    --r-xs: 6px;
    --r-sm: 8px;
    --r-md: 12px;
    --r-lg: 16px;
    --r-full: 999px;

    --ease: 150ms ease-out;
    --ease-modal: 200ms cubic-bezier(0.2, 0.8, 0.2, 1);

    --pad-x: 16px;
    --header-h: auto;
  }

  /* Светлая палитра (fallback + ручной режим) */
  :root[data-theme="light"] {
    --bg: #ffffff;
    --bg-elevated: #ffffff;
    --bg-secondary: #f5f5f7;
    --bg-tertiary: #ebebee;
    --text: #0e0e10;
    --text-2: #57575f;
    --hint: #86868b;
    --border: rgba(14, 14, 16, 0.08);
    --border-2: rgba(14, 14, 16, 0.14);
    --accent: #3163eb;
    --accent-text: #ffffff;
    --accent-soft: rgba(49, 99, 235, 0.10);
    --danger: #dc3545;
    --danger-soft: rgba(220, 53, 69, 0.10);
    --overlay: rgba(14, 14, 16, 0.45);
    --shadow-1: 0 1px 2px rgba(14, 14, 16, 0.06);
    --shadow-2: 0 10px 32px rgba(14, 14, 16, 0.14);
  }

  /* Тёмная палитра */
  :root[data-theme="dark"] {
    --bg: #0d0d0f;
    --bg-elevated: #16161a;
    --bg-secondary: #16161a;
    --bg-tertiary: #1e1e23;
    --text: #f2f2f4;
    --text-2: #a4a4ad;
    --hint: #75757e;
    --border: rgba(255, 255, 255, 0.08);
    --border-2: rgba(255, 255, 255, 0.14);
    --accent: #5b87f7;
    --accent-text: #ffffff;
    --accent-soft: rgba(91, 135, 247, 0.16);
    --danger: #ef5f63;
    --danger-soft: rgba(239, 95, 99, 0.16);
    --overlay: rgba(0, 0, 0, 0.62);
    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.35);
    --shadow-2: 0 10px 32px rgba(0, 0, 0, 0.55);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Inter", "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    transition: background-color 180ms ease, color 180ms ease;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  input { font: inherit; color: inherit; }
  input[type="search"]::-webkit-search-cancel-button { display: none; }
  ::selection { background: var(--accent-soft); }
  .icon { display: block; flex: none; }

  #app { min-height: 100dvh; display: flex; flex-direction: column; }

  /* ============================================================
     Header
     ============================================================ */
  .app-header {
    position: sticky;
    top: 0;
    z-index: 30;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: calc(env(safe-area-inset-top, 0px) + 10px) var(--pad-x) 12px;
  }

  .header-top {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 40px;
  }
  .title-block { flex: 1; min-width: 0; }
  .title {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.015em;
    margin: 0;
    line-height: 1.15;
  }
  .title-sm {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
    line-height: 1.2;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .subtitle { font-size: 13px; color: var(--hint); margin-top: 2px; }

  .header-actions { display: flex; align-items: center; gap: 6px; }

  /* Segmented theme switcher */
  .theme-switch {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    padding: 3px;
    border-radius: var(--r-sm);
    background: var(--bg-secondary);
    border: 1px solid var(--border);
  }
  .theme-switch button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px; height: 26px;
    border-radius: 5px;
    color: var(--hint);
    transition: background var(--ease), color var(--ease);
  }
  .theme-switch button:hover { color: var(--text); }
  .theme-switch button[aria-pressed="true"] {
    background: var(--bg);
    color: var(--text);
    box-shadow: var(--shadow-1);
  }

  /* Search */
  .toolbar { margin-top: 12px; }
  .search {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 40px;
    padding: 0 8px 0 12px;
    border-radius: var(--r-sm);
    background: var(--bg-secondary);
    color: var(--hint);
    transition: background var(--ease), box-shadow var(--ease);
  }
  .search:focus-within {
    background: var(--bg);
    box-shadow: inset 0 0 0 1.5px var(--accent);
    color: var(--accent);
  }
  .search input {
    flex: 1; min-width: 0;
    background: none; border: 0; outline: none;
    color: var(--text);
    font-size: 15px;
  }
  .search input::placeholder { color: var(--hint); }
  .search .clear {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px;
    border-radius: var(--r-xs);
    color: var(--hint);
    transition: background var(--ease), color var(--ease);
  }
  .search .clear:hover { background: var(--bg-tertiary); color: var(--text); }

  /* Sort segmented */
  .sort-bar { margin-top: 10px; display: flex; align-items: center; gap: 8px; }
  .segmented {
    display: flex;
    gap: 2px;
    padding: 3px;
    border-radius: var(--r-sm);
    background: var(--bg-secondary);
    flex: 1;
  }
  .segmented button {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    height: 30px;
    padding: 0 8px;
    border-radius: 5px;
    font-size: 13px;
    font-weight: 500;
    color: var(--hint);
    transition: background var(--ease), color var(--ease);
  }
  .segmented button:hover { color: var(--text); }
  .segmented button[aria-pressed="true"] {
    background: var(--bg);
    color: var(--text);
    box-shadow: var(--shadow-1);
  }
  .segmented button svg { opacity: 0.8; }

  /* ============================================================
     Buttons
     ============================================================ */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 40px;
    padding: 0 14px;
    border-radius: var(--r-sm);
    font-size: 14px;
    font-weight: 500;
    transition: transform var(--ease), background var(--ease), color var(--ease), opacity var(--ease);
    white-space: nowrap;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; pointer-events: none; }
  .btn-md { height: 48px; padding: 0 18px; font-size: 15px; }
  .btn-primary { background: var(--accent); color: var(--accent-text); }
  .btn-primary:hover { filter: brightness(1.05); }
  .btn-ghost { color: var(--accent); }
  .btn-ghost:hover { background: var(--accent-soft); }
  .btn-danger { color: var(--danger); }
  .btn-danger:hover { background: var(--danger-soft); }
  .btn-outline { border: 1px solid var(--border-2); color: var(--text); }
  .btn-outline:hover { background: var(--bg-secondary); }
  .btn-block { width: 100%; }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px; height: 36px;
    border-radius: var(--r-sm);
    color: var(--text-2);
    transition: background var(--ease), color var(--ease);
    flex: none;
  }
  .icon-btn:hover { background: var(--bg-secondary); color: var(--text); }
  .icon-btn-danger { color: var(--danger); }
  .icon-btn-danger:hover { background: var(--danger-soft); color: var(--danger); }

  /* ============================================================
     Content / sections
     ============================================================ */
  .content {
    flex: 1;
    padding: 20px var(--pad-x);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 140px);
  }

  .section + .section { margin-top: 28px; }
  .section-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    padding: 0 2px;
  }
  .section-title {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--hint);
    margin: 0;
  }
  .section-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 22px;
    height: 20px;
    padding: 0 7px;
    border-radius: var(--r-full);
    background: var(--bg-secondary);
    font-size: 12px;
    font-weight: 500;
    color: var(--hint);
    font-variant-numeric: tabular-nums;
  }

  /* ============================================================
     Folder grid
     ============================================================ */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }
  @media (min-width: 640px) {
    .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

  .folder-card {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
    padding: 14px;
    border-radius: var(--r-md);
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    text-align: left;
    transition: transform var(--ease), background var(--ease), border-color var(--ease);
    min-height: 108px;
  }
  .folder-card:hover { border-color: var(--border-2); background: var(--bg-secondary); }
  .folder-card:active { transform: scale(0.985); }

  .folder-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px; height: 40px;
    border-radius: var(--r-sm);
    background: var(--accent-soft);
    color: var(--accent);
  }
  .folder-body { width: 100%; min-width: 0; }
  .folder-name {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.005em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .folder-meta {
    font-size: 13px;
    color: var(--hint);
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }

  /* ============================================================
     File list
     ============================================================ */
  .list {
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    background: var(--bg-elevated);
    overflow: hidden;
  }

  .file-row {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 6px 4px 10px;
    border-bottom: 1px solid var(--border);
    transition: background var(--ease);
    position: relative;
  }
  .file-row:last-child { border-bottom: 0; }
  .file-row:hover { background: var(--bg-secondary); }
  .file-row.selected { background: var(--accent-soft); }

  .file-main {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 4px;
    text-align: left;
    border-radius: var(--r-sm);
  }

  .file-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px; height: 36px;
    border-radius: var(--r-sm);
    background: var(--bg-secondary);
    color: var(--text-2);
    flex: none;
  }
  .file-row.selected .file-icon { background: var(--bg); }

  .file-body { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 1px; }
  .file-name {
    font-size: 15px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    letter-spacing: -0.005em;
  }
  .file-meta {
    font-size: 13px;
    color: var(--hint);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .file-meta .dot { padding: 0 6px; opacity: 0.5; }

  .check {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px; height: 22px;
    border-radius: var(--r-full);
    background: var(--accent);
    color: var(--accent-text);
    flex: none;
    animation: pop 160ms cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  @keyframes pop {
    from { transform: scale(0.6); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  /* ============================================================
     Empty / skeleton
     ============================================================ */
  .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 48px 24px;
    text-align: center;
  }
  .empty-illustration { color: var(--hint); opacity: 0.55; margin-bottom: 6px; }
  .empty-title { font-size: 16px; font-weight: 500; color: var(--text); margin: 0; }
  .empty-text { font-size: 14px; color: var(--hint); margin: 0; max-width: 300px; line-height: 1.5; }
  .empty .btn { margin-top: 8px; }

  .skeleton {
    border-radius: var(--r-sm);
    background: var(--bg-secondary);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .skeleton-row { height: 60px; border-radius: 0; border-bottom: 1px solid var(--border); }
  .skeleton-row:last-child { border-bottom: 0; }
  .skeleton-card { height: 108px; border-radius: var(--r-md); }
  @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

  /* ============================================================
     Floating panels
     ============================================================ */
  .floating {
    position: fixed;
    left: var(--pad-x);
    right: var(--pad-x);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    z-index: 40;
    background: var(--bg-elevated);
    border: 1px solid var(--border-2);
    border-radius: var(--r-md);
    padding: 10px 12px;
    box-shadow: var(--shadow-2);
    animation: rise var(--ease-modal);
    max-width: 480px;
    margin-left: auto;
    margin-right: auto;
  }
  .floating-row { display: flex; align-items: center; gap: 6px; }
  .floating-label {
    flex: 1;
    font-size: 14px;
    color: var(--text-2);
    padding-left: 4px;
    font-variant-numeric: tabular-nums;
  }
  .floating-actions { display: flex; gap: 4px; }

  .upload-item { padding: 6px 4px; }
  .upload-item + .upload-item { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 10px; }
  .upload-head { display: flex; align-items: baseline; gap: 8px; }
  .upload-name {
    flex: 1;
    font-size: 14px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .upload-pct {
    font-size: 13px;
    color: var(--hint);
    font-variant-numeric: tabular-nums;
  }
  .progress {
    height: 4px;
    border-radius: var(--r-full);
    background: var(--bg-secondary);
    overflow: hidden;
    margin-top: 8px;
  }
  .progress-bar {
    height: 100%;
    width: 100%;
    background: var(--accent);
    transform-origin: left center;
    transform: scaleX(0);
    transition: transform 140ms linear;
    border-radius: var(--r-full);
  }

  /* ============================================================
     Bottom sheet
     ============================================================ */
  .sheet-backdrop {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: var(--overlay);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    animation: fade var(--ease-modal);
  }
  @media (min-width: 640px) {
    .sheet-backdrop { align-items: center; padding: 16px; }
  }

  .sheet {
    width: 100%;
    max-width: 460px;
    background: var(--bg);
    border-radius: var(--r-lg) var(--r-lg) 0 0;
    padding: 8px 20px calc(env(safe-area-inset-bottom, 0px) + 20px);
    box-shadow: var(--shadow-2);
    animation: slideUp var(--ease-modal);
    max-height: 88dvh;
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  @media (min-width: 640px) {
    .sheet {
      border-radius: var(--r-lg);
      padding: 20px 24px 24px;
      animation: rise var(--ease-modal);
    }
  }
  .sheet-handle {
    width: 36px; height: 4px;
    border-radius: var(--r-full);
    background: var(--border-2);
    margin: 4px auto 16px;
  }
  @media (min-width: 640px) { .sheet-handle { display: none; } }

  .sheet-title {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 4px;
  }
  .sheet-text { font-size: 14px; color: var(--hint); margin: 0 0 18px; line-height: 1.5; }
  .sheet-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }

  .field {
    width: 100%;
    height: 48px;
    padding: 0 14px;
    border-radius: var(--r-sm);
    border: 1px solid var(--border-2);
    background: var(--bg-secondary);
    outline: none;
    font-size: 15px;
    transition: border-color var(--ease), background var(--ease);
  }
  .field:focus { border-color: var(--accent); background: var(--bg); }

  .picker {
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    overflow: hidden;
    background: var(--bg-elevated);
    max-height: 320px;
    overflow-y: auto;
  }
  .picker-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    transition: background var(--ease);
    font-size: 15px;
  }
  .picker-item:last-child { border-bottom: 0; }
  .picker-item:hover { background: var(--bg-secondary); }
  .picker-item .icon { color: var(--text-2); flex: none; }
  .picker-item-danger .icon { color: var(--danger); }
  .picker-item-danger { color: var(--danger); }

  /* ============================================================
     Toasts
     ============================================================ */
  .toasts {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    left: 12px; right: 12px;
    z-index: 60;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    pointer-events: none;
  }
  .toast {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    max-width: 420px;
    padding: 11px 16px;
    border-radius: var(--r-md);
    background: var(--bg-elevated);
    border: 1px solid var(--border-2);
    box-shadow: var(--shadow-2);
    font-size: 14px;
    animation: rise var(--ease-modal);
    transition: opacity 200ms ease-out;
  }
  .toast .icon { color: var(--accent); flex: none; }
  .toast-error .icon { color: var(--danger); }
  .toast-error { border-color: var(--danger); }

  /* ============================================================
     Drag overlay
     ============================================================ */
  .drop-overlay {
    position: fixed;
    inset: 0;
    z-index: 70;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--overlay);
    animation: fade var(--ease-modal);
    pointer-events: none;
    padding: 24px;
  }
  .drop-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 36px 44px;
    border-radius: var(--r-lg);
    border: 2px dashed var(--accent);
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    font-weight: 500;
  }
  .drop-box .icon { color: var(--accent); }

  /* ============================================================
     Animations
     ============================================================ */
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts" class="toasts"></div>
<input type="file" id="hidden-file-input" multiple hidden aria-hidden="true" tabindex="-1">

<script>
(function () {
  'use strict';

  /* ================================================================
     Telegram WebApp
     ================================================================ */
  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  var initData = tg ? tg.initData : '';

  if (tg) {
    tg.ready();
    tg.expand();
    if (typeof tg.disableVerticalSwipes === 'function') tg.disableVerticalSwipes();
    if (typeof tg.enableClosingConfirmation === 'function') tg.enableClosingConfirmation();
  }

  /* ================================================================
     Тема: auto / light / dark
     ================================================================ */
  var TG_THEME_KEYS = [
    'bg_color', 'secondary_bg_color', 'text_color', 'hint_color', 'link_color',
    'button_color', 'button_text_color', 'section_bg_color', 'destructive_text_color'
  ];

  function readStoredTheme() {
    try {
      var value = localStorage.getItem('storage.theme');
      if (value === 'light' || value === 'dark' || value === 'auto') return value;
    } catch (e) { /* ignore */ }
    return 'auto';
  }

  function resolveTheme(pref) {
    if (pref === 'light' || pref === 'dark') return pref;
    if (tg && tg.colorScheme === 'dark') return 'dark';
    if (tg && tg.colorScheme === 'light') return 'light';
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) return 'dark';
    return 'light';
  }

  function applyTheme(pref) {
    var root = document.documentElement;
    var resolved = resolveTheme(pref);

    root.dataset.themePref = pref;
    root.dataset.theme = resolved;

    // Сбрасываем инлайн-переменные от Telegram

    };

      if (response.status === 401) {

        setTimeout(function () { if (tg) tg.close(); }, 1600);
        throw new Error('unauthorized');

        foldersBlock = emptyState(
          'Папок пока нет',
          'Создайте папку, чтобы разложить файлы по полкам',
          'folder'
        );
      }
      parts.push('<section class="section">' +
        '<div class="section-head"><h2 class="section-title">Папки</h2>' +
        (state.folders.length ? '<span class="section-count">' + state.folders.length + '</span>' : '') +
        '</div>' + foldersBlock + '</section>');
    }

    var filesBlock;
    if (state.loading) {
      filesBlock = skeletonList();
    } else if (state.files.length) {
      filesBlock = '<div class="list">' + state.files.map(fileRowHtml).join('') + '</div>';
    } else if (state.query) {
      filesBlock = emptyState('Ничего не найдено', 'Попробуйте изменить запрос', 'search');
    } else if (state.folderId === null) {
      filesBlock = emptyState(
        'В корне пусто',
        'Перетащите файлы в окно или отправьте их боту — они окажутся здесь',
        'file',
        '<button class="btn btn-outline" data-action="pick-files">' + icon('upload', 16) + 'Загрузить файл</button>'
      );
    } else {
      filesBlock = emptyState(
        'В папке пусто',
        'Перетащите файлы в окно или отправьте их боту',
        'file',
        '<button class="btn btn-outline" data-action="pick-files">' + icon('upload', 16) + 'Загрузить файл</button>'
      );
    }

    parts.push('<section class="section">' +
      '<div class="section-head"><h2 class="section-title">' +
      (state.folderId === null ? 'Все файлы' : 'Содержимое') + '</h2>' +
      (state.files.length ? '<span class="section-count">' + state.files.length + '</span>' : '') +
      '</div>' + filesBlock + '</section>');

    return parts.join('');
  }

  function selectionBarHtml() {
    if (!state.selection.length) return '';
    return '<div class="floating"><div class="floating-row">' +
      '<span class="floating-label">Выбрано: ' + state.selection.length + '</span>' +
      '<div class="floating-actions">' +
      '<button class="icon-btn" data-action="bulk-move" aria-label="Переместить">' + icon('moveTo', 20) + '</button>' +
      '<button class="icon-btn icon-btn-danger" data-action="bulk-delete" aria-label="Удалить">' + icon('trash', 20) + '</button>' +
      '<button class="icon-btn" data-action="bulk-clear" aria-label="Снять выделение">' + icon('close', 20) + '</button>' +
      '</div></div></div>';
  }

  function uploadPanelHtml() {
    if (!state.uploads.length) return '';
    return '<div class="floating">' + state.uploads.map(function (item) {
      return '<div class="upload-item">' +
        '<div class="upload-head">' +
        '<span class="upload-name">' + escapeHtml(item.name) + '</span>' +
        '<span class="upload-pct">' + Math.round(item.progress * 100) + '%</span>' +
        '</div>' +
        '<div class="progress"><div class="progress-bar" style="transform:scaleX(' + item.progress + ')"></div></div>' +
        '</div>';
    }).join('') + '</div>';
  }

  function sheetHtml() {
    var modal = state.modal;
    if (!modal) return '';

    var body = '';
    var showHandle = true;

    if (modal.type === 'new-folder') {
      body = '<h2 class="sheet-title">Новая папка</h2>' +
        '<p class="sheet-text">Дайте папке понятное имя — его можно будет использовать для сортировки файлов.</p>' +
        '<input class="field" type="text" maxlength="64" placeholder="Например, Документы" ' +
        'data-focus-key="folder-name" autocomplete="off">' +
        '<div class="sheet-actions">' +
        '<button class="btn btn-ghost" data-action="modal-close">Отмена</button>' +
        '<button class="btn btn-primary" data-action="create-folder">Создать</button>' +
        '</div>';
    } else if (modal.type === 'move') {
      var items = '<button class="picker-item" data-action="move-to" data-id="0">' +
        icon('file', 20) + '<span>Без папки</span></button>';
      items += state.folders.map(function (folder) {
        return '<button class="picker-item" data-action="move-to" data-id="' + Number(folder.id) + '">' +
          icon('folder', 20) + '<span>' + escapeHtml(folder.name) + '</span></button>';
      }).join('');
      body = '<h2 class="sheet-title">Переместить</h2>' +
        '<p class="sheet-text">Файлов выбрано: ' + state.selection.length + '</p>' +
        '<div class="picker">' + items + '</div>' +
        '<div class="sheet-actions"><button class="btn btn-ghost" data-action="modal-close">Отмена</button></div>';
    } else if (modal.type === 'confirm-delete') {
      body = '<h2 class="sheet-title">Удалить файлы</h2>' +
        '<p class="sheet-text">Будет удалено записей: ' + state.selection.length + '. Действие необратимо.</p>' +
        '<div class="sheet-actions">' +
        '<button class="btn btn-ghost" data-action="modal-close">Отмена</button>' +
        '<button class="btn btn-primary" data-action="confirm-delete" style="background:var(--danger)">Удалить</button>' +
        '</div>';
    } else if (modal.type === 'actions') {
      body = '<h2 class="sheet-title">Действия</h2>' +
        '<div class="picker">' +
        '<button class="picker-item" data-action="download-one" data-id="' + Number(modal.id) + '">' +
        icon('download', 20) + '<span>Скачать</span></button>' +
        '<button class="picker-item" data-action="move-one" data-id="' + Number(modal.id) + '">' +
        icon('moveTo', 20) + '<span>Переместить</span></button>' +
        '<button class="picker-item picker-item-danger" data-action="delete-one" data-id="' + Number(modal.id) + '">' +
        icon('trash', 20) + '<span>Удалить</span></button>' +
        '</div>' +
        '<div class="sheet-actions"><button class="btn btn-ghost" data-action="modal-close">Закрыть</button></div>';
    }

    return '<div class="sheet-backdrop" data-sheet-backdrop>' +
      '<div class="sheet" role="dialog" aria-modal="true">' +
      (showHandle ? '<div class="sheet-handle"></div>' : '') +
      body +
      '</div></div>';
  }

  function dragOverlayHtml() {
    if (!state.dragging) return '';
    return '<div class="drop-overlay"><div class="drop-box">' +
      icon('upload', 36) +
      '<span>Отпустите, чтобы загрузить</span>' +
      '</div></div>';
  }

  function render() {
    var host = document.getElementById('app');
    var active = document.activeElement;
    var focusKey = active && active.dataset ? active.dataset.focusKey : null;
    var caret = null;

    if (focusKey && typeof active.selectionStart === 'number') caret = active.selectionStart;

    host.innerHTML =
      '<header class="app-header">' + headerHtml() + '</header>' +
      '<main class="content">' + contentHtml() + '</main>' +
      selectionBarHtml() +
      uploadPanelHtml() +
      sheetHtml() +
      dragOverlayHtml();

    if (focusKey) {
      var next = host.querySelector('[data-focus-key="' + focusKey + '"]');
      if (next) {
        next.focus();
        if (caret != null && typeof next.setSelectionRange === 'function') {
          try { next.setSelectionRange(caret, caret); } catch (e) { /* ignore */ }
        }
      }
    }

    if (tg && tg.BackButton) {
      if (state.folderId === null) tg.BackButton.hide();
      else tg.BackButton.show();
    }
  }

  /* ================================================================
     Events: long-press для multiselect
     ================================================================ */
  var longPressTimer = null;
  var suppressClick = false;
  var pressStart = null;

  function cancelLongPress() {
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    pressStart = null;
  }

  document.addEventListener('pointerdown', function (event) {
    var row = event.target.closest('[data-row-id]');
    if (!row || event.button !== 0) return;
    var id = Number(row.dataset.rowId);
    pressStart = { x: event.clientX, y: event.clientY };
    longPressTimer = setTimeout(function () {
      longPressTimer = null;
      suppressClick = true;
      if (state.selection.indexOf(id) < 0) toggleSelection(id);
      if (navigator.vibrate) try { navigator.vibrate(10); } catch (e) { /* ignore */ }
    }, 420);
  });

  document.addEventListener('pointerup', cancelLongPress);
  document.addEventListener('pointercancel', cancelLongPress);
  document.addEventListener('pointermove', function (event) {
    if (!pressStart || !longPressTimer) return;
    if (Math.abs(event.clientX - pressStart.x) > 10 || Math.abs(event.clientY - pressStart.y) > 10) {
      cancelLongPress();
    }
  });
  document.addEventListener('scroll', cancelLongPress, true);

  /* ================================================================
     Events: click
     ================================================================ */
  document.addEventListener('click', function (event) {
    // Backdrop модалки — закрыть
    var backdrop = event.target.closest('[data-sheet-backdrop]');
    if (backdrop && event.target === backdrop) {
      state.modal = null;
      return;
    }

    if (suppressClick) { suppressClick = false; return; }

    var actionEl = event.target.closest('[data-action]');
    if (!actionEl) return;

    var action = actionEl.dataset.action;

    switch (action) {
      case 'open-folder': {
        var fid = Number(actionEl.dataset.id);
        var folder = state.folders.filter(function (item) { return item.id === fid; })[0];
        openFolder(fid, folder ? folder.name : '');
        break;
      }
      case 'back':
        openRoot();
        break;
      case 'new-folder':
        state.modal = { type: 'new-folder' };
        break;
      case 'create-folder':
        createFolderFromModal();
        break;
      case 'set-theme': {
        var pref = actionEl.dataset.theme;
        state.themePref = pref;
        try { localStorage.setItem('storage.theme', pref); } catch (e) { /* ignore */ }
        applyTheme(pref);
        break;
      }
      case 'sort':
        setSort(actionEl.dataset.key);
        break;
      case 'clear-search':
        searchValue = '';
        state.query = '';
        loadFiles();
        break;
      case 'zip':
        downloadZip();
        break;
      case 'pick-files':
        document.getElementById('hidden-file-input').click();
        break;
      case 'row-click': {
        var rowId = Number(actionEl.dataset.id);
        if (state.selection.length || event.ctrlKey || event.metaKey) {
          toggleSelection(rowId);
        } else {
          downloadFile(rowId);
        }
        break;
      }
      case 'row-more':
        state.modal = { type: 'actions', id: Number(actionEl.dataset.id) };
        break;
      case 'download-one':
        state.modal = null;
        downloadFile(Number(actionEl.dataset.id));
        break;
      case 'move-one':
        state.selection = [Number(actionEl.dataset.id)];
        state.modal = { type: 'move' };
        break;
      case 'delete-one':
        state.selection = [Number(actionEl.dataset.id)];
        state.modal = { type: 'confirm-delete' };
        break;
      case 'bulk-move':
        state.modal = { type: 'move' };
        break;
      case 'bulk-delete':
        state.modal = { type: 'confirm-delete' };
        break;
      case 'bulk-clear':
        state.selection = [];
        break;
      case 'move-to': {
        var target = Number(actionEl.dataset.id);
        moveSelected(target > 0 ? target : null);
        break;
      }
      case 'confirm-delete':
        deleteSelected();
        break;
      case 'modal-close':
        state.modal = null;
        break;
      default:
        break;
    }
  });

  /* ================================================================
     Events: input / keyboard / file input
     ================================================================ */
  document.addEventListener('input', function (event) {
    var key = event.target.dataset ? event.target.dataset.focusKey : null;
    if (key === 'search') onSearchInput(event.target.value);
  });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') {
      if (state.modal) { state.modal = null; return; }
      if (state.selection.length) { state.selection = []; return; }
      var active = document.activeElement;
      if (active && active.dataset && active.dataset.focusKey === 'search') active.blur();
    }
    if (event.key === 'Enter' && state.modal && state.modal.type === 'new-folder') {
      createFolderFromModal();
    }
    if (event.key === '/' && !event.target.matches('input, textarea')) {
      var search = document.querySelector('[data-focus-key="search"]');
      if (search) { event.preventDefault(); search.focus(); }
    }
  });

  var fileInput = document.getElementById('hidden-file-input');
  fileInput.addEventListener('change', function () {
    if (fileInput.files && fileInput.files.length) {
      uploadFiles(fileInput.files);
    }
    fileInput.value = '';
  });

  /* ================================================================
     Events: drag & drop
     ================================================================ */
  var dragDepth = 0;

  window.addEventListener('dragenter', function (event) {
    if (!event.dataTransfer) return;
    event.preventDefault();
    dragDepth++;
    state.dragging = true;
  });

  window.addEventListener('dragover', function (event) {
    event.preventDefault();
    if (event.dataTransfer) event.dataTransfer.dropEffect = 'copy';
  });

  window.addEventListener('dragleave', function (event) {
    event.preventDefault();
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) state.dragging = false;
  });

  window.addEventListener('drop', function (event) {
    event.preventDefault();
    dragDepth = 0;
    state.dragging = false;
    if (event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files.length) {
      uploadFiles(event.dataTransfer.files);
    }
  });

  /* ================================================================
     Telegram events
     ================================================================ */
  if (tg && typeof tg.onEvent === 'function') {
    tg.onEvent('themeChanged', function () {
      if (state.themePref === 'auto') applyTheme('auto');
    });
  }

  if (tg && tg.BackButton && typeof tg.BackButton.onClick === 'function') {
    tg.BackButton.onClick(function () {
      if (state.folderId !== null) openRoot();
    });
  }

  /* ================================================================
     Boot
     ================================================================ */
  applyTheme(state.themePref);
  render();
  loadFolders();
  loadFiles();
})();
</script>
</body>
</html>
